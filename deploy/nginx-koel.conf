# /etc/nginx/sites-available/koel  ->  symlink into sites-enabled
#
# Serves the React build (dist/) and proxies /api/ and /admin/ to Gunicorn
# over a unix socket. Start with this HTTP-only file, then run:
#     certbot --nginx -d koel.sadguruinfinity.com
# Certbot adds the HTTPS server block and the HTTP -> HTTPS redirect for you.

upstream koel_backend {
    server unix:/run/koel/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name koel.sadguruinfinity.com;

    root /home/koel-control-engineering-dashboard---management-portal--ind.-marine-/dist;
    index index.html;

    client_max_body_size 20m;

    # ---- security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # ---- REST API -> Django ----
    location /api/ {
        proxy_pass http://koel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    # ---- Django admin (data browser) ----
    location /admin/ {
        proxy_pass http://koel_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django admin static files (collectstatic output)
    location /static/ {
        alias /home/koel-control-engineering-dashboard---management-portal--ind.-marine-/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # ---- React build: hashed assets can be cached forever ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached so new deployments are picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- single page app fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve dotfiles / env files
    location ~ /\.(?!well-known) {
        deny all;
    }
}
